# MySQL 프로파일 — 기본값은 로컬 개발, NAS는 DB_* 환경 변수로 연결
# 사용법: -Dspring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:coffee_order}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:coffee}
spring.datasource.password=${DB_PASSWORD:coffee1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway 전용이며 기본 프로파일의 H2 설정을 상속하지 않음
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
