spring.application.name=demo

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# H2 Database Configuration (File Mode)
spring.datasource.url=jdbc:h2:file:./data/demo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Flyway — H2 프로파일에서는 비활성 (스키마는 JPA ddl-auto로 관리. MySQL 프로파일에서만 활성)
spring.flyway.enabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.coffeeorder.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Application Data Path (이미지 저장 등)
app.data.path=./data

# Redis Configuration (분산 락 및 동기화 상태 관리)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Admin Password (건의사항 관리용)
app.admin.password=${ADMIN_PASSWORD:admin1234}

# Twosome Integration (세션 고도화)
# OCR 사이드카 주소 (로컬: localhost, NAS docker-compose: http://ocr:8090)
twosome.ocr.url=${TWOSOME_OCR_URL:http://localhost:8090}
# KEEP-ALIVE 스케줄러 on/off (기본 true)
twosome.keepalive.enabled=${TWOSOME_KEEPALIVE_ENABLED:true}
twosome.keepalive.interval=${TWOSOME_KEEPALIVE_INTERVAL:600000}
# 자동 재로그인용 관리자 자격증명은 소스에 저장하지 않음
twosome.admin.id=${TWOSOME_ADMIN_ID:}
twosome.admin.pw=${TWOSOME_ADMIN_PW:}

# 설정 탭의 관리자 로그인 비밀번호. 비어 있으면 로그인 불가.
# ADMIN_PASSWORD 환경변수로 오버라이드 가능.
admin.password=${ADMIN_PASSWORD:admin1234}

# 대표 투썸 계정 자격증명 암호화 키 (Base64, 32바이트). 미설정 시 랜덤 생성 후 Redis 영속(경고 로그).
twosome.crypto.key=${TWOSOME_CRYPTO_KEY:}

# 매장 메뉴 새로고침 배치 (매일 오전 8시 30분, 오픈 직후)
twosome.menu-refresh.enabled=${TWOSOME_MENU_REFRESH_ENABLED:true}
twosome.menu-refresh.cron=0 30 8 * * *
